[project]
name = "pdf-chatbot"
version = "0.1.0"
description = "Fragen zu PDFs stellen (RAG mit Claude)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
eval = [
    "fastembed>=0.5",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "fpdf2>=2.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905", "B905"]
